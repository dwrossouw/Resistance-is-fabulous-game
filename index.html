<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resistance is Fabulous</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="start-screen" class="container">
      <img src="/images/warning.png" alt="warning image">
      <h1>Resistance is FABULOUS!</h1>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="game-screen" class="container">
      <div id="game-box">
        <div id="skyline"></div>
        <div id="buildings"></div>
        <div id="road"></div>

        <div id="game-display">
          <span id="timer">00:00</span>
          <div id="fab-meter"><img id="fab-object" src="/images/crown.png" alt="crown"></img></div>
        </div>
      </div>
    </div>

    <div id="game-over-screen" class="container">
      <img src="/images/gameover.png" alt="gameover pic">
      <h1>CONGRATULATIONS!!</h1>
      <h3>It took you ... to become FABULOUS!</h3>
      <button id="restart-btn">Restart Game</button>
    </div>

    <script src="./js/main.js"></script>
    <script src="./js/player.js"></script>
    <script src="./js/enemy.js"></script>
  </body>
</html>
